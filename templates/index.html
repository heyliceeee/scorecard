<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alice Dias – Sustainability Scorecard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #fdfbff, #f7f4ff);
            font-family: 'Noto Sans JP', sans-serif;
        }
        .hero { padding: 80px 0; }
        .btn-anime {
            border-radius: 50px;
            padding: 10px 25px;
            background: #e8e1ff;
            border: none;
            transition: .2s;
            font-weight: 500;
        }
        .btn-anime:hover { background: #d3c8ff; }
    </style>
</head>

<body>

<nav class="navbar navbar-light shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🌸 Alice Dias</span>
    </div>
</nav>

<section class="hero text-center">
    <div class="container">
        <h1 class="display-6 fw-bold">Sustainability Scorecard</h1>
        <p class="lead">Insere o código de barras de um produto</p>

        <form action="/product" method="POST" class="mt-4">
            <input type="text" name="barcode" class="form-control w-50 mx-auto" placeholder="Ex: 3017624010701">
            <button class="btn-anime mt-3">Gerar Scorecard</button>
        </form>
    </div>
</section>

</body>
</html>
