<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #fdfbff, #f7f4ff);
            font-family: 'Noto Sans JP', sans-serif;
        }
        .loading {
            text-align: center;
            padding-top: 120px;
        }
    </style>
</head>

<body>

<div class="loading">
    <h2 class="fw-bold">A gerar o scorecard… 🌸</h2>
    <p class="text-muted">Produto: {{ barcode }}</p>

    <div class="spinner-border text-secondary mt-4" role="status"></div>

    <script>
        setTimeout(() => {
            window.location.href = "/product/{{ barcode }}";
        }, 800);
    </script>
</div>

</body>
</html>
